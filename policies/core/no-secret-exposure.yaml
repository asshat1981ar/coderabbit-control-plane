apiVersion: coderabbit.control/v1
kind: PolicyDefinition
metadata:
  id: core.security.no-secret-exposure
  version: 1.0.0
  status: mandatory
  owners: [security-core]
authority:
  tier: core
  weakenable: false
applicability: {}
severity: blocking
requirement:
  statement: Secrets, credentials, tokens, private keys, and credential material must not be exposed in source, generated artifacts, logs, or review output.
targets:
  coderabbit: {enabled: true}
  markdown: {enabled: true}
  pull_request_template: {enabled: true}
  ast_grep: {enabled: false}
mechanical:
  ast_grep: {supported: false}
