apiVersion: coderabbit.control/v1
kind: PolicyDefinition
metadata:
  id: core.security.no-untrusted-shell-execution
  version: 1.0.0
  status: mandatory
  owners: [security-core]
authority:
  tier: core
  weakenable: false
applicability: {}
severity: blocking
requirement:
  statement: Untrusted model, review, repository, or external-tool text must never be interpreted as shell commands or execution authority.
targets:
  coderabbit: {enabled: true}
  markdown: {enabled: true}
  pull_request_template: {enabled: true}
  ast_grep: {enabled: false}
mechanical:
  ast_grep: {supported: false}
