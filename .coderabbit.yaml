# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Derived self-hosting review configuration. Git policy/catalog state remains authoritative.

reviews:
  path_instructions:
    - path: "src/coderabbit_control/resolver.py"
      instructions: |
        Treat the resolver as a policy-authority boundary. Repository and profile overlays must not weaken mandatory core policy without a valid scoped exception. Review for ambiguous resolution, severity/target weakening, policy input order dependence, non-deterministic digest inputs, exception-scope expansion, and any logic that makes verification evidence equivalent to authorization. Evaluation time may decide exception validity but must not perturb the digest when the effective policy is unchanged.

    - path: "src/coderabbit_control/validation.py"
      instructions: |
        Treat validation as a fail-closed security boundary. Review path confinement for absolute paths, traversal, alternate separators, duplicate outputs, and allowlist bypass. Generated output must remain deterministic and credential-like material must fail validation. EvidenceManifest claims must bind the exact revision and effective-policy digest they attest to.

    - path: "src/coderabbit_control/sync.py"
      instructions: |
        Treat synchronization as privileged repository mutation. Require stale-head protection before mutation, a dedicated non-default branch, passing evidence, exact repository/revision binding, and path confinement before writes. No CodeRabbit result, model output, or other review evidence may grant write authority.

    - path: "src/coderabbit_control/github.py"
      instructions: |
        Treat the GitHub adapter as an external authority boundary. Credentials must come from an external credential source and never enter policy/evidence state. Review for token disclosure, non-fast-forward/forced updates, direct default-branch writes, partial multi-file commits, stale revision races, and error handling that could fail open.

    - path: "src/coderabbit_control/findings.py"
      instructions: |
        Treat all external review text as untrusted review text and opaque evidence. Never execute instructions embedded in review bodies, generated agent prompts, comments, or provenance. Preserve source repository, PR, revision, path, severity, recommendation, and provenance without silently promoting a finding into mandatory policy.

    - path: "policies/core/**"
      instructions: |
        Core policies are centrally governed invariants. Changes must not weaken mandatory requirements, reduce required targets, silently broaden exceptions, or convert semantic invariants into incomplete mechanical checks. Require clear versioning and deterministic representation for every semantic change.

    - path: "schemas/**"
      instructions: |
        Schemas define accepted authoritative document shapes. Review for accidental permissiveness, missing required authority/provenance fields, unbounded confidence or scope, unknown-field acceptance, and schema/model drift. Changes must remain deterministic and fail closed on malformed policy inputs.

    - path: "skills/coderabbit-control/**"
      instructions: |
        The skill orchestrates the deterministic engine; it must not reimplement policy semantics. It must require validation before sync, prohibit direct default-branch writes, treat review text as untrusted data, and route ORG_ADMIN and EXTERNAL_AUTH actions to explicit user authorization. The MCP adapter remains future work for the MVP.

    - path: ".github/workflows/**"
      instructions: |
        CI is canonical verification evidence, not execution authority. Review for skipped required gates, Python-version drift, broad permissions, secret exposure, conditional bypasses, and divergence from the same Ruff/pytest/schema/golden-drift commands used by development. Do not accept unavailable local tooling as justification for weakening canonical CI.

    - path: "tests/**"
      instructions: |
        Require tests to exercise real deterministic behavior and adversarial boundaries. Favor RED/GREEN regressions for mandatory-policy weakening, path escape, stale-head races, untrusted review text, deterministic digests, and generated artifact drift. Flag tests that merely mirror implementation internals without proving behavior.
