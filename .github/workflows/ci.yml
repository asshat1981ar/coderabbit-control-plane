name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check src tests

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Pytest
        run: python -m pytest -q
