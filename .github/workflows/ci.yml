name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check src tests

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Pytest
        run: python -m pytest -q

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate schemas and policy documents
        run: python -m pytest tests/test_schema.py tests/test_policy_loader.py -q
      - name: Build exact-head repository fingerprint
        run: crctl discover . --revision "$GITHUB_SHA" --json > "$RUNNER_TEMP/control-plane-fingerprint.json"
      - name: Validate self-hosting effective policy
        run: >-
          crctl validate
          --manifest repositories/control-plane.yaml
          --fingerprint "$RUNNER_TEMP/control-plane-fingerprint.json"
          --as-of "$(date -u +%F)"
          --json
      - name: Audit local fleet target without mutation
        run: crctl audit-fleet . --revision "$GITHUB_SHA" --dry-run --json

  fixture-recompile-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Recompile golden fixtures and detect drift
        run: >-
          python -m pytest
          tests/test_compiler_coderabbit.py
          tests/test_compiler_markdown.py
          tests/test_compiler_pull_request.py
          tests/test_compiler_ast_grep.py
          tests/test_drift.py
          -q

  pilot-dry-run-artifacts:
    runs-on: ubuntu-latest
    needs: [ruff, pytest, schema-validation, fixture-recompile-drift]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile and validate pilot snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot-out
          for pilot in autodev aura-cli markdown-control; do
            crctl compile \
              --manifest "repositories/pilots/${pilot}.yaml" \
              --fingerprint "repositories/fingerprints/${pilot}.yaml" \
              --as-of "2026-08-21" \
              --json > "pilot-out/${pilot}.compile.json"
            crctl validate \
              --manifest "repositories/pilots/${pilot}.yaml" \
              --fingerprint "repositories/fingerprints/${pilot}.yaml" \
              --as-of "2026-08-21" \
              --json > "pilot-out/${pilot}.evidence.json"
          done
          crctl audit-fleet --dry-run --json --as-of "2026-08-21" > pilot-out/fleet-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-dry-run-${{ github.sha }}
          path: pilot-out/
          if-no-files-found: error
